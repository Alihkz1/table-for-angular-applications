<div class="table-wrapper">
    <div class="table-actions" [class.rtl]="direction === 'rtl'">
        <button class="table-actions-btn" (click)="toggleColumnsMenu()">
            <span class="table-actions-btn-dots">•••</span>
        </button>

        <div class="columns-menu-container" *ngIf="showColumnsMenu">
            <app-columns-visibility [headers]="headers" (columnToggled)="onColumnToggled($event)"
                (onSave)="onSaveColumns()" (onClose)="onCancelColumns()">
            </app-columns-visibility>
        </div>
    </div>

    <div class="pagination-container" *ngIf="showPagination && tableService.dataSource?.length || 0 > 0">
        <div class="pagination-controls">
            <button class="pagination-btn" [disabled]="currentPage === 1" (click)="previousPage()"
                [class.disabled]="currentPage === 1">
                {{ direction === 'rtl' ? '›' : '‹' }}
            </button>

            <div class="page-numbers">
                <button *ngFor="let page of getPageNumbers()" class="page-number" [class.active]="page === currentPage"
                    (click)="goToPage(page)">
                    {{ page }}
                </button>
            </div>

            <button class="pagination-btn" [disabled]="currentPage === totalPages" (click)="nextPage()"
                [class.disabled]="currentPage === totalPages">
                {{ direction === 'rtl' ? '‹' : '›' }}
            </button>
        </div>

        <div class="page-size-selector" *ngIf="pageSizeOptions?.length || 0 > 0">
            <label>page size:</label>
            <select [ngModel]="pageSize" (ngModelChange)="onPageSizeChange($event)">
                <option *ngFor="let size of pageSizeOptions" [value]="size">{{ size }}</option>
            </select>
        </div>

        <div class="pagination-info">
            <span>Total Items: {{tableService.dataSource.length}}</span>
        </div>
    </div>

    <table class="table" [dir]="direction">
        <thead>
            <tr>
                <th class="th drag-handle-column">
                    <div class="h-100 flex-center">
                        ≡
                    </div>
                </th>

                <th class="th" *ngFor="let header of visibleHeaders; let i = index" [ngClass]="header.className ?? ''"
                    [class.column-dragging]="i === dragColumnIndex" [class.drag-over-left]="dragOverIndex === i"
                    [class.drag-over-right]="dragOverIndex === i + 1" [style.width.px]="header.width"
                    [style.min-width.px]="header.width">
                    <div class="h-100 d-flex align-items-center justify-content-between">
                        <div class="header-content">
                            {{ header.title }}
                            <didar-table-sort-column *ngIf="header.sortable" [header]="header"
                                [currentPageData]="displayData">
                            </didar-table-sort-column>
                        </div>
                        <div class="header-controls">
                            <div class="column-drag-handle" (mousedown)="startColumnDrag($event, i)">
                                ≡
                            </div>
                            <div class="resizer" (mousedown)="startColumnResize($event, i)"></div>
                        </div>
                    </div>
                </th>
            </tr>
        </thead>
        <ng-container *ngIf="loading; else loaded">
            <div class="loading-container">
                <div class="loader"></div>
            </div>
        </ng-container>
        <ng-template #loaded>
            <ng-container *ngIf="displayData.length === 0; else dataHasLength">
                <div class="empty-container">
                    <div class="empty-row">
                        <img src="assets/empty.svg" alt="" class="empty-row-icon">
                        <p class="empty-row-text">دیتایی موجود نیست</p>
                    </div>
                </div>
            </ng-container>
            <ng-template #dataHasLength>
                <tbody class="h-100 w-100 overflow-auto">
                    <ng-container *ngFor="let row of displayData; let i = index">
                        <tr [ngStyle]="{ 'height' : rowHeight + 'px'}" [class.row-dragging]="i === dragRowIndex"
                            [class.drag-over-above]="dragOverRowIndex === i"
                            [class.drag-over-below]="dragOverRowIndex === i + 1">
                            <td class="cell drag-handle-cell" (mousedown)="startRowDrag($event, i)">
                                <div class="h-100 d-flex align-items-center justify-content-center">
                                    ≡
                                </div>
                            </td>
                            <td *ngFor="let header of visibleHeaders; trackBy: trackByHeader" class="cell"
                                [ngClass]="header.className ?? ''" [style.width.px]="header.width">
                                <ng-container *ngIf="header.dynamicCellComponent" [column]="header" [row]="row"
                                    [onRowEvent]="onRowEvent" [component]="header.dynamicCellComponent" dynamicCell>
                                </ng-container>
                                <ng-container *ngIf="!header.dynamicCellComponent">
                                    <div class="d-flex justify-content-start align-items-center">
                                        {{ header.valueFormatter ? header.valueFormatter(row[header.key], row) :
                                        row[header.key] }}
                                    </div>
                                </ng-container>
                            </td>
                        </tr>
                    </ng-container>
                </tbody>
            </ng-template>
        </ng-template>
    </table>
</div>
