<div class="actions-wrapper">
<button class="actions-trigger" (click)="toggleColumnsMenu($event)">
    <span class="actions-icon">•••</span>
</button>
    <div class="actions-menu" *ngIf="showColumnsMenu">
        <div *ngFor="let header of actionHeaders" class="menu-item">
            <div class="menu-content" (click)="onEvent(header.actionName)">
                <span class="menu-title">{{ header.title }}</span>
            </div>
        </div>
    </div>
</div>
